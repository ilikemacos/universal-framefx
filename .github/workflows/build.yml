name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build
        run: dotnet build -c Release

  agent:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build LarkquillAI panel and agent UI
        run: dotnet build Agent/FrameFX.Agent.UI -c Release
      - name: Test agent core (LarkquillAI client, plans, offline fallback)
        run: dotnet test Agent/tests/FrameFX.Agent.Tests -c Release
